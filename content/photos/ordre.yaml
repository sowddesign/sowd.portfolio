# ORDRE DES PHOTOS — une entrée par photo, de la première affichée à la dernière.
# « fichier » : nom de l'image placée dans public/photos/ (obligatoire).
# « description » : texte affiché au survol de la photo et lu par les lecteurs d'écran (obligatoire).
