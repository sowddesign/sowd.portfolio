# MÉTHODE — ÉTAPES ET PAGES, de la première affichée à la dernière.
# Les numéros (01, 02…) des étapes et des pages suivent l'ordre de ce fichier : rien à renuméroter.
#
# Pour chaque étape :
#   titre       : gros titre (H3) ;
#   description : petit texte à côté du titre ;
#   intro       : nom du fichier de sa page d'introduction (content/methode/intros/<intro>.md) ;
#   pages       : une ligne par page, « - fichier: Nom affiché dans le menu ».
#                 Le fichier est content/methode/pages/<fichier>.md, ses images dans public/methode/<fichier>/.
#
# Pour changer l'ordre ou déplacer une page dans une autre étape, déplace sa ligne (garde les deux espaces devant « - »).
# Pour renommer une page dans le menu, change le texte après « : ».
# Une page dont le fichier n'existe pas encore est listée dans le menu, sans contenu.
# Les lignes commençant par « # » sont des commentaires.

